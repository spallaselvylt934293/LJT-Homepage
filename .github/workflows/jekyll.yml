# Build, verify, and deploy the personal homepage.
name: Deploy Academic Pages template site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
      - name: Build and verify personal content
        run: |
          bundle exec jekyll build --strict_front_matter --trace --baseurl "${{ steps.pages.outputs.base_path }}"
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          class Page(HTMLParser):
              def __init__(self, source):
                  super().__init__(convert_charrefs=True)
                  self.text = []
                  self.links = []
                  self.headings = []
                  self.heading = None
                  self.feed(source)

              def handle_starttag(self, tag, attrs):
                  if tag == 'h2':
                      self.heading = []
                  attrs = dict(attrs)
                  for key in ('href', 'src'):
                      if attrs.get(key):
                          self.links.append(attrs[key])

              def handle_endtag(self, tag):
                  if tag == 'h2' and self.heading is not None:
                      self.headings.append(''.join(self.heading).strip())
                      self.heading = None

              def handle_data(self, data):
                  self.text.append(data)
                  if self.heading is not None:
                      self.heading.append(data)

          site = Path('_site')
          base = '/LJT-Homepage'
          home = Page((site / 'index.html').read_text())
          publications_page = Page((site / 'publications/index.html').read_text())
          records = [
              ('synlogic', 'SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond', '2025', 'Arxiv', 'Junteng Liu, Yuanxiang Fan, Zhuo Jiang, Han Ding, Yongyi Hu, Chi Zhang, Yiqi Shi, Shitong Weng, Aili Chen, Shiqi Chen, Yunan Huang, Mozhi Zhang, Pengyu Zhao, Junjie Yan, Junxian He.'),
              ('chart-understanding', 'On the Perception Bottleneck of VLMs for Chart Understanding', '2025', 'Arxiv', 'Junteng Liu, Weihao Zeng, Xiwen Zhang, Yijun Wang, Zifei Shan, Junxian He.'),
              ('truthfulness-hyperplane', 'On the Universal Truthfulness Hyperplane Inside LLMs', '2024', 'EMNLP 2024', 'Junteng Liu, Shiqi Chen, Yu Cheng, Junxian He.'),
              ('in-context-sharpness', 'In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation', '2024', 'ICML 2024', 'Shiqi Chen, Miao Xiong, Junteng Liu, Zhengxuan Wu, Teng Xiao, Siyang Gao, Junxian He.'),
              ('c-eval', 'C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models', '2023', 'NeurIPS 2023', 'Yuzhen Huang, Yuzhuo Bai, Zhihao Zhu, Junlei Zhang, Jinghan Zhang, Tangjun Su, Junteng Liu, Chuancheng Lv, Yikai Zhang, Jiayi Lei, Yao Fu, Maosong Sun, Junxian He.'),
              ('parameter-efficient-modules', 'Composing Parameter-Efficient Modules with Arithmetic Operations', '2023', 'NeurIPS 2023', 'Jinghan Zhang, Shiqi Chen, Junteng Liu, Junxian He.'),
          ]
          sections = ['About Me', 'Education', 'Skills and Research Interests', 'Research Experience', 'Honors', 'Publications', 'Contact']
          assert home.headings == sections[:6] + [record[1] for record in records] + sections[6:], home.headings
          home_text = ''.join(home.text)
          for value in ['Ph.D. in Computer Science', 'B.Eng.', '2020–2024', 'June 2024', 'Professor Junxian He', 'MINIMAX', 'February 2025–Present', 'Tencent WXG', 'June 2024–September 2024', 'Zifei Shan', 'Shanghai AI Lab', 'June 2023–December 2023', 'Prof. Yu Cheng', 'Zhiyuan Honor Scholarship', 'jliugi@connect.ust.hk']:
              assert value in home_text, value
          for value in ['mailto:jliugi@connect.ust.hk', 'https://github.com/Vicent0205', 'https://twitter.com/junteng88716710', 'https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate']:
              assert value in home.links, value
          for slug, title, year, venue, authors in records:
              detail_path = f'publications/{slug}/index.html'
              detail = Page((site / detail_path).read_text())
              for page in [home, publications_page, detail]:
                  text = ''.join(page.text)
                  assert title in text, title
                  assert authors in text, (slug, 'authors')
                  assert venue in text, (slug, 'venue')
                  assert f', {year}' in text, (slug, 'year')
              link = f'{base}/publications/{slug}/'
              assert home.links.count(link) == 1, (slug, 'homepage link')
              assert publications_page.links.count(link) == 1, (slug, 'publications link')
          for placeholder in ['Your Name', 'Your Sidebar Name', 'Red Brick University', 'none@example.org', 'Paper Title Number', 'Stuart Geiger']:
              assert placeholder not in home_text, placeholder
              assert placeholder not in ''.join(publications_page.text), placeholder
          allowed = {'index.html', 'about/index.html', 'about.html', '404.html', 'publications/index.html'}
          allowed.update(f'publications/{record[0]}/index.html' for record in records)
          actual = {str(path.relative_to(site)) for path in site.rglob('*.html')}
          assert actual == allowed, {'unexpected': sorted(actual - allowed), 'missing': sorted(allowed - actual)}
          for path in site.rglob('*.html'):
              page = Page(path.read_text())
              for target in page.links:
                  if target.startswith(base + '/'):
                      candidate = site / target[len(base) + 1:].split('#')[0].split('?')[0]
                      assert candidate.exists() or candidate.with_name(candidate.name + '.html').exists() or (candidate / 'index.html').exists(), (str(path), target)
          print('Verified all six publications on About and Publications, personal details, contact links, page inventory, and local asset/navigation references.')
          print('Generated HTML pages and redirects:')
          print('\n'.join(sorted(actual)))
          PY
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
